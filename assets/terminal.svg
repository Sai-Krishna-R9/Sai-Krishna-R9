<svg width="1000" height="350" viewBox="0 0 1000 350" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="350" rx="14" fill="#1E1F22"/>
  <rect width="1000" height="40" rx="14" fill="#2B2D31"/>
  <rect y="26" width="1000" height="14" fill="#2B2D31"/>
  <circle cx="28" cy="20" r="6" fill="#D7263D"/>
  <circle cx="50" cy="20" r="6" fill="#6B6E73"/>
  <circle cx="72" cy="20" r="6" fill="#4A4C51"/>
  <text x="500" y="25" text-anchor="middle" font-family="monospace" font-size="14" fill="#8A8D91">sai@krishna: ~</text>
  <g font-family="monospace" font-size="22">
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="0.5s" dur="0.1s" fill="freeze"/>
      <text x="30" y="85"><tspan fill="#D7263D">sai@krishna</tspan><tspan fill="#8A8D91">:~$ </tspan><tspan fill="#D4D6D9">whoami</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="1.3s" dur="0.1s" fill="freeze"/>
      <text x="30" y="119" fill="#D4D6D9">P Sai Krishna Reddy</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="2.2s" dur="0.1s" fill="freeze"/>
      <text x="30" y="153"><tspan fill="#D7263D">sai@krishna</tspan><tspan fill="#8A8D91">:~$ </tspan><tspan fill="#D4D6D9">cat status.txt</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="3.0s" dur="0.1s" fill="freeze"/>
      <text x="30" y="187" fill="#8A8D91">B.Tech CSE (Quantum Computing) | year 1</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="3.4s" dur="0.1s" fill="freeze"/>
      <text x="30" y="221" fill="#D4D6D9">building: <tspan fill="#D7263D">Samvaad-Setu</tspan> (ISL computer vision)</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="4.3s" dur="0.1s" fill="freeze"/>
      <text x="30" y="255"><tspan fill="#D7263D">sai@krishna</tspan><tspan fill="#8A8D91">:~$ </tspan><tspan fill="#D4D6D9">ls skills/</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="5.1s" dur="0.1s" fill="freeze"/>
      <text x="30" y="289" fill="#D4D6D9">python   git   linux   <tspan fill="#8A8D91">opencv (learning)</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="6s" dur="0.1s" fill="freeze"/>
      <text x="30" y="323"><tspan fill="#D7263D">sai@krishna</tspan><tspan fill="#8A8D91">:~$ </tspan></text>
      <rect x="232" y="305" width="12" height="22" fill="#D7263D">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
